<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fahrzeugverwaltung</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(h);
    
    const defaultVehicles = [
      { id: 1, name: 'Audi A3', type: 'car', details: '1.6 8P Petrol - 2011', vin: '', photos: [], documents: [], tuv: { date: '', cost: 0 }, oil: { lastChange: '', lastKm: 0, interval: 15000, intervalMonths: 12 }, tax: { amount: 0, dueDate: '' }, insurance: { amount: 0, dueDate: '' }, repairs: [], currentKm: 0 },
      { id: 2, name: 'Honda FR-V', type: 'car', details: '2.2 Diesel', vin: '', photos: [], documents: [], tuv: { date: '', cost: 0 }, oil: { lastChange: '', lastKm: 0, interval: 15000, intervalMonths: 12 }, tax: { amount: 0, dueDate: '' }, insurance: { amount: 0, dueDate: '' }, repairs: [], currentKm: 0 },
      { id: 3, name: 'Golf 4', type: 'car', details: '1.6 Petrol', vin: '', photos: [], documents: [], tuv: { date: '', cost: 0 }, oil: { lastChange: '', lastKm: 0, interval: 15000, intervalMonths: 12 }, tax: { amount: 0, dueDate: '' }, insurance: { amount: 0, dueDate: '' }, repairs: [], currentKm: 0 },
      { id: 4, name: 'BMW R1100RT', type: 'bike', details: 'Motorrad', vin: '', photos: [], documents: [], tuv: { date: '', cost: 0 }, oil: { lastChange: '', lastKm: 0, interval: 8000, intervalMonths: 24 }, tax: { amount: 0, dueDate: '' }, insurance: { amount: 0, dueDate: '' }, repairs: [], currentKm: 0 },
      { id: 5, name: 'Kymco Maxi 400i', type: 'bike', details: 'Roller', vin: '', photos: [], documents: [], tuv: { date: '', cost: 0 }, oil: { lastChange: '', lastKm: 0, interval: 8000, intervalMonths: 24 }, tax: { amount: 0, dueDate: '' }, insurance: { amount: 0, dueDate: '' }, repairs: [], currentKm: 0 },
      { id: 6, name: 'SYM Fiddle 3', type: 'bike', details: '200i Roller', vin: '', photos: [], documents: [], tuv: { date: '', cost: 0 }, oil: { lastChange: '', lastKm: 0, interval: 8000, intervalMonths: 24 }, tax: { amount: 0, dueDate: '' }, insurance: { amount: 0, dueDate: '' }, repairs: [], currentKm: 0 }
    ];

    function VehicleManager() {
      const loadVehicles = () => {
        try {
          const saved = localStorage.getItem('vehicleData');
          return saved ? JSON.parse(saved) : defaultVehicles;
        } catch {
          return defaultVehicles;
        }
      };

      const [vehicles, setVehicles] = useState(loadVehicles());
      const [selectedVehicle, setSelectedVehicle] = useState(null);
      const [showRepairForm, setShowRepairForm] = useState(false);
      const [showAddVehicle, setShowAddVehicle] = useState(false);
      const [newRepair, setNewRepair] = useState({ date: '', description: '', cost: 0 });
      const [newVehicle, setNewVehicle] = useState({ name: '', type: 'car', details: '' });

      useEffect(() => {
        localStorage.setItem('vehicleData', JSON.stringify(vehicles));
      }, [vehicles]);

      const calculateDaysUntil = (dateStr) => {
        if (!dateStr) return null;
        return Math.ceil((new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24));
      };

      const getOilChangeStatus = (vehicle) => {
        if (!vehicle.oil.lastChange || !vehicle.oil.lastKm) return 'Keine Daten';
        const monthsSince = (new Date() - new Date(vehicle.oil.lastChange)) / (1000 * 60 * 60 * 24 * 30);
        const kmSince = vehicle.currentKm - vehicle.oil.lastKm;
        const monthsRemaining = vehicle.oil.intervalMonths - monthsSince;
        const kmRemaining = vehicle.oil.interval - kmSince;
        if (monthsRemaining <= 0 || kmRemaining <= 0) return 'Überfällig!';
        if (monthsRemaining <= 2 || kmRemaining <= 2000) return 'Bald fällig';
        return \`OK (\${Math.round(kmRemaining)} km / \${Math.round(monthsRemaining)} Monate)\`;
      };

      const getVehicleTotalCost = (vehicle) => {
        return (vehicle.tuv.cost || 0) + (vehicle.tax.amount || 0) + (vehicle.insurance.amount || 0) + vehicle.repairs.reduce((sum, r) => sum + (r.cost || 0), 0);
      };

      const getTotalYearlyCost = () => vehicles.reduce((sum, v) => sum + getVehicleTotalCost(v), 0);

      const updateVehicle = (id, updates) => {
        setVehicles(prev => prev.map(v => v.id === id ? { ...v, ...updates } : v));
        if (selectedVehicle?.id === id) setSelectedVehicle(prev => ({ ...prev, ...updates }));
      };

      const addRepair = (vehicleId) => {
        const vehicle = vehicles.find(v => v.id === vehicleId);
        updateVehicle(vehicleId, { repairs: [...vehicle.repairs, { ...newRepair, id: Date.now() }] });
        setNewRepair({ date: '', description: '', cost: 0 });
        setShowRepairForm(false);
      };

      const addVehicle = () => {
        const newId = Math.max(...vehicles.map(v => v.id), 0) + 1;
        setVehicles([...vehicles, { 
          ...newVehicle, 
          id: newId, 
          vin: '', 
          photos: [], 
          documents: [], 
          tuv: { date: '', cost: 0 }, 
          oil: { lastChange: '', lastKm: 0, interval: newVehicle.type === 'car' ? 15000 : 8000, intervalMonths: newVehicle.type === 'car' ? 12 : 24 }, 
          tax: { amount: 0, dueDate: '' }, 
          insurance: { amount: 0, dueDate: '' }, 
          repairs: [], 
          currentKm: 0 
        }]);
        setNewVehicle({ name: '', type: 'car', details: '' });
        setShowAddVehicle(false);
      };

      const exportToExcel = () => {
        try {
          let csvContent = "Fahrzeug,Typ,Details,VIN,KM-Stand,TÜV Datum,TÜV Kosten,Ölwechsel Datum,Ölwechsel KM,Steuer,Steuer Fällig,Versicherung,Versicherung Fällig,Reparaturen Gesamt,Gesamtkosten\n";
          vehicles.forEach(v => {
            const repairsTotal = v.repairs.reduce((sum, r) => sum + (r.cost || 0), 0);
            const row = [v.name, v.type === 'car' ? 'Auto' : 'Motorrad/Roller', v.details, v.vin || '', v.currentKm || 0, v.tuv.date || '', v.tuv.cost || 0, v.oil.lastChange || '', v.oil.lastKm || 0, v.tax.amount || 0, v.tax.dueDate || '', v.insurance.amount || 0, v.insurance.dueDate || '', repairsTotal.toFixed(2), getVehicleTotalCost(v).toFixed(2)];
            csvContent += row.map(field => `"${field}"`).join(',') + "\n";
          });
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = \`fahrzeuge_export_\${new Date().toISOString().split('T')[0]}.csv\`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error('Export error:', error);
        }
      };

      const exportToJSON = () => {
        try {
          const dataStr = JSON.stringify(vehicles, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = \`fahrzeuge_backup_\${new Date().toISOString().split('T')[0]}.json\`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error('Backup error:', error);
        }
      };

      const importFromFile = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (Array.isArray(imported)) setVehicles(imported);
            } catch {
              console.error('Import failed');
            }
          };
          reader.readAsText(file);
        }
      };

      const handleImageUpload = (vehicleId, type, e) => {
        Array.from(e.target.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const vehicle = vehicles.find(v => v.id === vehicleId);
            updateVehicle(vehicleId, { [type === 'photo' ? 'photos' : 'documents']: [...vehicle[type === 'photo' ? 'photos' : 'documents'], event.target.result] });
          };
          reader.readAsDataURL(file);
        });
      };

      if (!selectedVehicle) {
        return html\`
          <div class="min-h-screen bg-gray-900 text-white p-6">
            <div class="max-w-7xl mx-auto">
              <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
                <div>
                  <h1 class="text-4xl font-bold mb-2">Fahrzeugverwaltung</h1>
                  <p class="text-gray-400">Vehicle Management System</p>
                </div>
                <div class="flex gap-3 flex-wrap">
                  <button onclick=\${() => setShowAddVehicle(true)} class="px-4 py-2 bg-orange-600 rounded-lg hover:bg-orange-700 flex items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <div><div>Neues Fahrzeug</div><div class="text-xs italic">New Vehicle</div></div>
                  </button>
                  <button onclick=\${exportToExcel} class="px-4 py-2 bg-green-600 rounded-lg hover:bg-green-700 flex items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <div><div>Excel</div><div class="text-xs italic">Export</div></div>
                  </button>
                  <button onclick=\${exportToJSON} class="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <div><div>Backup</div><div class="text-xs italic">Download</div></div>
                  </button>
                  <label class="px-4 py-2 bg-purple-600 rounded-lg hover:bg-purple-700 flex items-center gap-2 cursor-pointer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <div><div>Import</div><div class="text-xs italic">Upload</div></div>
                    <input type="file" accept=".json" onchange=\${importFromFile} class="hidden" />
                  </label>
                </div>
              </div>

              \${showAddVehicle && html\`
                <div class="bg-gray-800 rounded-lg p-6 mb-8">
                  <h2 class="text-2xl font-bold mb-4">Neues Fahrzeug hinzufügen</h2>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="text" value=\${newVehicle.name} oninput=\${(e) => setNewVehicle({ ...newVehicle, name: e.target.value })} placeholder="Name" class="bg-gray-700 rounded px-3 py-2" />
                    <select value=\${newVehicle.type} onchange=\${(e) => setNewVehicle({ ...newVehicle, type: e.target.value })} class="bg-gray-700 rounded px-3 py-2">
                      <option value="car">Auto</option>
                      <option value="bike">Motorrad/Roller</option>
                    </select>
                    <input type="text" value=\${newVehicle.details} oninput=\${(e) => setNewVehicle({ ...newVehicle, details: e.target.value })} placeholder="Details" class="bg-gray-700 rounded px-3 py-2 md:col-span-2" />
                  </div>
                  <div class="flex gap-3">
                    <button onclick=\${addVehicle} class="px-4 py-2 bg-green-600 rounded hover:bg-green-700">Hinzufügen</button>
                    <button onclick=\${() => setShowAddVehicle(false)} class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-700">Abbrechen</button>
                  </div>
                </div>
              \`}
              
              <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg p-6 mb-8">
                <h2 class="text-2xl font-bold mb-2">Jahreskosten Gesamt<span class="block text-sm font-normal italic text-gray-200">Total Annual Cost</span></h2>
                <p class="text-4xl font-bold">€\${getTotalYearlyCost().toFixed(2)}</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                \${vehicles.map(vehicle => {
                  const tuvDays = calculateDaysUntil(vehicle.tuv.date);
                  const oilStatus = getOilChangeStatus(vehicle);
                  return html\`
                    <div key=\${vehicle.id} class="bg-gray-800 rounded-lg p-6 relative group">
                      <button onclick=\${() => setVehicles(prev => prev.filter(v => v.id !== vehicle.id))} class="absolute top-4 right-4 p-2 bg-red-600 rounded-lg hover:bg-red-700 transition opacity-0 group-hover:opacity-100">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                      </button>
                      <div onclick=\${() => setSelectedVehicle(vehicle)} class="cursor-pointer">
                        <div class="flex items-center gap-3 mb-4">
                          \${vehicle.type === 'car' ? html\`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>\` : html\`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="11" width="2" height="10"/><path d="M7 19V9c0-1.1.9-2 2-2h9l3 3v7a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><circle cx="8.5" cy="19.5" r="1.5"/><circle cx="15.5" cy="19.5" r="1.5"/></svg>\`}
                          <div>
                            <h3 class="text-xl font-bold">\${vehicle.name}</h3>
                            <p class="text-gray-400 text-sm">\${vehicle.details}</p>
                          </div>
                        </div>
                        <div class="space-y-2 text-sm">
                          <div class="flex justify-between">
                            <span class="text-gray-400">TÜV: <span class="text-xs italic">Inspection</span></span>
                            <span class="\${tuvDays !== null && tuvDays < 30 ? 'text-red-400' : 'text-green-400'}">
                              \${vehicle.tuv.date || html\`<span>Nicht eingetragen</span>\`}\${tuvDays !== null ? \` (\${tuvDays}T)\` : ''}
                            </span>
                          </div>
                          <div class="flex justify-between">
                            <span class="text-gray-400">Ölwechsel: <span class="text-xs italic">Oil Change</span></span>
                            <span class="\${oilStatus.includes('fällig') ? 'text-red-400' : 'text-green-400'}">\${oilStatus}</span>
                          </div>
                          <div class="flex justify-between">
                            <span class="text-gray-400">Gesamtkosten: <span class="text-xs italic">Total Cost</span></span>
                            <span class="text-blue-400 font-bold">€\${getVehicleTotalCost(vehicle).toFixed(2)}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  \`;
                })}
              </div>
            </div>
          </div>
        \`;
      }

      // DETAIL VIEW (continues in next message - too long!)
      return html\`<div class="min-h-screen bg-gray-900 text-white p-6"><div class="max-w-6xl mx-auto"><button onclick=\${() => setSelectedVehicle(null)} class="mb-6 px-4 py-2 bg-gray-800 rounded-lg">← Zurück</button><h1 class="text-3xl font-bold">\${selectedVehicle.name} Details</h1><p class="text-gray-400 mt-4">Full detail view - Add your vehicle data!</p></div></div>\`;
    }
    
    render(html\`<\${VehicleManager} />\`, document.getElementById('root'));
  </script>
</body>
</html>
